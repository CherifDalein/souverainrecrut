services:
  jenkins:
    build: .
    image: souverainrecrut-jenkins:1.0.0
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home          # config et jobs persistants
      - /var/run/docker.sock:/var/run/docker.sock  # accès au Docker de l'hôte
    group_add:
      - "0"   # le socket Docker Desktop appartient au groupe root
    networks:
      - ci

volumes:
  jenkins_home:

networks:
  ci:
    name: ci
